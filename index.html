<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGRC - Benvenuto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <!--
      Pagina pubblica di accesso.
      login.js alterna #login-view e #register-view senza ricaricare la pagina:
      la registrazione crea l'utente e il ricettario vuoto, mentre il login
      crea la sessione in sessionStorage e porta alla home.
    -->
    <header class="bg-primary text-white text-center py-4">
      <h1 class="mb-0 fs-4"><i class="bi bi-book-half me-2"></i>Piattaforma Gestione Ricette di Cucina</h1>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-4 px-3">
      <div class="card shadow login-card">
        <div class="card-body p-4">
          <!-- Vista Login -->
          <div id="login-view">
            <h2 class="card-title text-center mb-4">Accedi</h2>
            <form id="login-form">
              <div class="mb-3">
                <label for="login-username" class="form-label">Username</label>
                <input type="text" class="form-control" id="login-username" required />
              </div>
              <div class="mb-3">
                <label for="login-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="login-password" required />
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-box-arrow-in-right me-1"></i>Accedi
                </button>
              </div>
            </form>
            <p class="text-center mt-3 mb-0">Non hai un account? <a href="#" id="show-register">Registrati</a></p>
          </div>

          <!-- Vista Registrazione -->
          <div id="register-view" class="hidden">
            <h2 class="card-title text-center mb-4">Registrazione</h2>
            <form id="register-form">
              <div class="mb-3">
                <label for="register-username" class="form-label">Username</label>
                <input type="text" class="form-control" id="register-username" required />
              </div>
              <div class="mb-3">
                <label for="register-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="register-email" required />
              </div>
              <div class="mb-3">
                <label for="register-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="register-password" minlength="6" required />
              </div>
              <div class="mb-3">
                <label for="register-favorites" class="form-label">Piatti Preferiti</label>
                <input
                  type="text"
                  class="form-control"
                  id="register-favorites"
                  placeholder="es. Pizza, Spaghetti, Tiramisu" />
                <div class="form-text">Facoltativo &mdash; separati da virgola.</div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Registrati</button>
              </div>
            </form>
            <p class="text-center mt-3 mb-0">Hai già un account? <a href="#" id="show-login">Accedi</a></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">&copy; 2026 Progetto Universitario PWM</p>
    </footer>

    <!-- Ordine script: storage/ui/auth definiscono i servizi, login.js usa quei servizi. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>

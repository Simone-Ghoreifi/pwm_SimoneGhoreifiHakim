<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGRC - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="app-shell d-flex flex-column min-vh-100">

    <!--
        Prima pagina privata dell'applicazione.
        home.js protegge l'accesso con auth.checkAuth(), inizializza cache e filtri
        TheMealDB, poi popola #results-container con card generate dinamicamente.
    -->

    <nav class="navbar navbar-expand-md navbar-dark bg-primary fixed-top">
        <div class="container-fluid px-3">
            <a class="navbar-brand navbar-brand-home fw-bold" href="home.html"
               aria-label="Torna alla home">
                <i class="bi bi-book-half me-1"></i>PGRC
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="cookbook.html">
                            <i class="bi bi-journal-bookmark me-1"></i>Ricettario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">
                            <i class="bi bi-person me-1"></i>Area Personale
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 container py-4">
        <h2 class="mb-4">Cerca una Ricetta</h2>

        <div class="row g-3 mb-4 align-items-end">
            <!--
                I criteri sono mutualmente esclusivi:
                il testo lavora con #search-type, categoria e area hanno select dedicate.
            -->
            <!-- Barra di ricerca con selettore tipo -->
            <div class="col-md-7">
                <label class="form-label fw-semibold">Cerca</label>
                <div class="input-group">
                    <select class="form-select search-type-select" id="search-type"
                            title="Tipo di ricerca" aria-label="Tipo di ricerca">
                        <option value="name">Per Nome</option>
                        <option value="ingredient">Per Ingrediente</option>
                        <option value="letter">Per Iniziale</option>
                    </select>
                    <input type="text" class="form-control" id="search-input"
                           placeholder="es. Pasta, Curry...">
                </div>
            </div>
            <!-- Filtro Categoria -->
            <div class="col-md-2">
                <label for="category-filter" class="form-label fw-semibold">Categoria</label>
                <select class="form-select" id="category-filter">
                    <option value="">Tutte le Categorie</option>
                </select>
            </div>
            <!-- Filtro Area -->
            <div class="col-md-3">
                <label for="area-filter" class="form-label fw-semibold">Area Geografica</label>
                <select class="form-select" id="area-filter">
                    <option value="">Tutte le Aree</option>
                </select>
            </div>
        </div>

        <p id="search-message" class="text-center text-muted fs-5 my-3"></p>
        <!-- Griglia vuota all'avvio: home.js inserisce qui le card delle ricette. -->
        <div id="results-container"
             class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Progetto Universitario PWM</p>
    </footer>

    <!-- Ordine script: api/storage/ui/auth preparano i servizi, home.js orchestra la pagina. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/home.js"></script>
</body>
</html>

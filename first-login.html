<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGRC - Primo Accesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-primary text-white text-center py-4">
        <h1 class="mb-0 fs-4">
            <i class="bi bi-book-half me-2"></i>Piattaforma Gestione Ricette di Cucina
        </h1>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-4 px-3">
        <div class="card shadow login-card">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-check text-primary display-5"></i>
                <h2 class="card-title mt-3 mb-2">Account creato</h2>
                <p id="first-login-message" class="text-muted mb-4">
                    Registrazione completata. Effettua il primo login per convalidare l'accesso.
                </p>
                <button type="button" id="go-login-btn" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Vai al Login
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Progetto Universitario PWM</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/first-login.js"></script>
</body>
</html>

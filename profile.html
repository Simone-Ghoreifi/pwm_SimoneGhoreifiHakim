<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGRC - Area Personale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body class="app-shell d-flex flex-column min-vh-100">

    <!--
        Pagina privata dell'area personale.
        profile.js mostra i dati salvati in pgrc_users, abilita la modifica solo
        su richiesta e gestisce cancellazione account con pulizia dati correlati.
    -->

    <nav class="navbar navbar-expand-md navbar-dark bg-primary fixed-top">
        <div class="container-fluid px-3">
            <a class="navbar-brand navbar-brand-home fw-bold" href="home.html"
               aria-label="Torna alla home">
                <i class="bi bi-book-half me-1"></i>PGRC
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="cookbook.html">
                            <i class="bi bi-journal-bookmark me-1"></i>Ricettario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="profile.html">
                            <i class="bi bi-person me-1"></i>Area Personale
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 container py-4 d-flex align-items-center justify-content-center">
        <section class="card shadow pgrc-profile-card w-100">
            <div class="card-body p-4 p-lg-5">
                <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
                    <div>
                        <h2 class="card-title mb-1">
                            <i class="bi bi-person-circle me-2"></i>Area Personale
                        </h2>
                        <p class="text-muted mb-0">Dati account salvati nel Web Storage del browser.</p>
                    </div>
                    <div class="d-flex align-items-start gap-2">
                        <button type="button" id="edit-profile-btn" class="btn btn-primary">
                            <i class="bi bi-pencil me-1"></i>Modifica Dati
                        </button>
                        <button type="button" id="delete-profile-btn" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Rimuovi
                        </button>
                    </div>
                </div>

                <!-- Campi disabilitati di default: profile.js li sblocca con "Modifica Dati". -->
                <form id="profile-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="profile-username" class="form-label">Nome utente</label>
                            <input type="text" class="form-control profile-field" id="profile-username"
                                   autocomplete="username" disabled required>
                        </div>
                        <div class="col-md-6">
                            <label for="profile-email" class="form-label">Email</label>
                            <input type="email" class="form-control profile-field" id="profile-email"
                                   autocomplete="email" disabled required>
                        </div>
                        <div class="col-md-6">
                            <label for="profile-favorites" class="form-label">Piatti preferiti</label>
                            <input type="text" class="form-control profile-field" id="profile-favorites"
                                   placeholder="es. Pizza, Risotto" disabled>
                        </div>
                        <div class="col-md-6">
                            <label for="profile-password" class="form-label">Password</label>
                            <!-- La password non viene letta dal Web Storage: il placeholder è solo visivo. -->
                            <div class="input-group">
                                <input type="password" class="form-control" id="profile-password"
                                       minlength="6" autocomplete="new-password"
                                       placeholder="••••••••" disabled>
                                <button type="button" id="unlock-password-btn"
                                        class="btn btn-outline-primary"
                                        data-bs-toggle="tooltip"
                                        data-bs-title="Cambia password"
                                        aria-label="Cambia password">
                                    <i class="bi bi-exclamation-circle"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" id="cancel-edit-btn" class="btn btn-outline-secondary hidden">
                            Annulla
                        </button>
                        <button type="submit" id="save-profile-btn" class="btn btn-primary" disabled>
                            <i class="bi bi-floppy me-1"></i>Salva Modifiche
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Progetto Universitario PWM</p>
    </footer>

    <!-- Ordine script: storage/ui/auth sono dipendenze dirette di profile.js. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>

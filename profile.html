<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGRC - Area Personale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container-fluid px-3">
            <a class="navbar-brand navbar-brand-home fw-bold" href="home.html"
               aria-label="Torna alla home">
                <i class="bi bi-book-half me-1"></i>PGRC
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="profile.html">
                            <i class="bi bi-person me-1"></i>Area Personale
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 container py-4">

        <!-- Dati Utente -->
        <section id="profile-details" class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">
                    <i class="bi bi-person-circle me-2"></i>Dati Utente
                </h2>
                <p class="mb-1"><strong>Nome Utente:</strong> <span id="profile-username"></span></p>
                <p class="mb-1"><strong>Email:</strong> <span id="profile-email"></span></p>
                <p class="mb-0"><strong>Piatti Preferiti:</strong> <span id="profile-favorites" class="text-muted"></span></p>

                <!-- Form modifica (nascosto di default) -->
                <div id="edit-profile-form" class="hidden mt-4 pt-3 border-top">
                    <form id="update-form">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="update-email" class="form-label">Nuova Email</label>
                                <input type="email" class="form-control" id="update-email">
                            </div>
                            <div class="col-md-6">
                                <label for="update-favorites" class="form-label">Piatti Preferiti</label>
                                <input type="text" class="form-control" id="update-favorites">
                            </div>
                            <div class="col-md-6">
                                <label for="update-current-password" class="form-label">
                                    Password Attuale
                                </label>
                                <input type="password" class="form-control" id="update-current-password"
                                       autocomplete="current-password">
                                <div class="form-text">Richiesta solo per cambiare password.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="update-password" class="form-label">
                                    Nuova Password <span class="text-muted">(min. 6 caratteri)</span>
                                </label>
                                <input type="password" class="form-control" id="update-password"
                                       minlength="6" autocomplete="new-password">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-floppy me-1"></i>Salva Modifiche
                            </button>
                        </div>
                        <p id="update-message" class="fw-semibold mt-2 mb-0"></p>
                    </form>
                </div>

                <div class="mt-3 d-flex gap-2">
                    <button type="button" id="edit-profile-btn" class="btn btn-primary">
                        <i class="bi bi-pencil me-1"></i>Modifica Dati
                    </button>
                    <button type="button" id="delete-profile-btn" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>Rimuovi Profilo
                    </button>
                </div>
            </div>
        </section>

        <!-- Ricettario Personale -->
        <section id="my-cookbook" class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">
                    <i class="bi bi-journal-bookmark me-2"></i>Il Mio Ricettario
                </h2>
                <div id="cookbook-container"
                     class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
                </div>
                <p id="cookbook-message" class="text-muted mt-3 mb-0"></p>
            </div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2025 Progetto Universitario Alberto Stanzani</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGRC - Ricettario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cookbook.css">
</head>
<body class="app-shell d-flex flex-column min-vh-100">

    <!--
        Pagina privata del ricettario personale.
        cookbook.js legge pgrc_cookbooks, carica i dettagli ricetta da cache/API e
        genera card con due azioni: rimozione confermata e recensione/edit recensione.
    -->

    <nav class="navbar navbar-expand-md navbar-dark bg-primary fixed-top">
        <div class="container-fluid px-3">
            <a class="navbar-brand navbar-brand-home fw-bold" href="home.html"
               aria-label="Torna alla home">
                <i class="bi bi-book-half me-1"></i>PGRC
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="cookbook.html">
                            <i class="bi bi-journal-bookmark me-1"></i>Ricettario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">
                            <i class="bi bi-person me-1"></i>Area Personale
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 container py-4">
        <div class="mb-4">
            <div>
                <h2 class="mb-1">
                    <i class="bi bi-journal-bookmark me-2"></i>Il Mio Ricettario
                </h2>
                <p class="text-muted mb-0">Ricette salvate, recensioni e accesso rapido al dettaglio.</p>
            </div>
        </div>

        <p id="cookbook-message" class="text-muted fs-5 my-3"></p>
        <!-- Container gestito via JS: le card non sono statiche perché dipendono dall'utente loggato. -->
        <div id="cookbook-container"
             class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Progetto Universitario PWM</p>
    </footer>

    <!-- Ordine script: api/storage/ui/auth sono dipendenze dirette di cookbook.js. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cookbook.js"></script>
</body>
</html>

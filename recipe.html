<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGRC - Dettaglio Ricetta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/recipe.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container-fluid px-3">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="bi bi-book-half me-1"></i>PGRC
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">
                            <i class="bi bi-house me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">
                            <i class="bi bi-person me-1"></i>Area Personale
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 container py-4">

        <!-- Dettaglio Ricetta — popolato da JS -->
        <div id="recipe-detail-container" class="card shadow-sm mb-4">
            <div class="card-body p-4"></div>
        </div>

        <!-- Sezione Recensioni -->
        <div id="reviews-section" class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">
                    <i class="bi bi-chat-quote me-2"></i>Recensioni
                </h3>

                <div id="reviews-list" class="mb-4"></div>

                <hr>
                <h5 class="mb-3">Lascia la tua recensione</h5>
                <form id="review-form">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="review-date" class="form-label">Data di Preparazione</label>
                            <input type="date" class="form-control" id="review-date" required>
                        </div>
                        <div class="col-md-4">
                            <label for="review-difficulty" class="form-label">
                                Difficolt&agrave; <span class="text-muted">(1&ndash;5)</span>
                            </label>
                            <input type="number" class="form-control" id="review-difficulty"
                                   min="1" max="5" required>
                        </div>
                        <div class="col-md-4">
                            <label for="review-taste" class="form-label">
                                Gusto <span class="text-muted">(1&ndash;5)</span>
                            </label>
                            <input type="number" class="form-control" id="review-taste"
                                   min="1" max="5" required>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i>Invia Recensione
                        </button>
                        <button type="button" id="delete-review-btn" class="btn btn-danger hidden">
                            <i class="bi bi-trash me-1"></i>Rimuovi Recensione
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2025 Progetto Universitario Alberto Stanzani</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/recipe.js"></script>
</body>
</html>
